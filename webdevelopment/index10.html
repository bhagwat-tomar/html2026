<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid properties</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing:border-box;
        }
        body{
            height:100vh;
            width:100vw;
        }
        div{
            border:2px solid black;
            font-size:2rem;
        }
        .container{
            background-color:rgb(203, 224, 224);
            height:100%;
            width:100%;
            display:grid;
            row-gap:5px;
            grid-template-columns:repeat(3,200px);
        }
        .item{
            background-color:crimson;
            /* padding:10px; */
        }
        .center{
            display:flex;
            justify-content:center;
            align-items:center;

        }
        .header{
            grid-column-start:1;
            grid-column-end:4;
        }
        .footer{
            grid-column-start:1;
            grid-column-end:4;
        }
        .sidebar{
            grid-row-start:2;
            grid-row-end:4;
        }
        .content{
            grid-column-start:2;
            grid-column-end:4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item center header">Header</div>
        <div class="item center">item2</div>
        <div class="item center">item3</div>
        <div class="item center">item4</div>
        <div class="item center">item5</div>
        <div class="item center">item6</div>
    </div>
</body>
</html>

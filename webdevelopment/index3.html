<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 10px;
        }
        h1{
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: 900;
            color:blue;
            font-style:oblique;
            text-align:center;
            text-decoration:underline;
            text-transform:capitalize;
            text-shadow: 2px 2px 500px red;
            line-height: 1.5;
        }
        p{
            font-family: 'Arial', sans-serif;
            font-size: 3rem;
            font-weight: 100;
            font-style:italic;
            text-align:right;
            text-decoration:overline;
            text-transform:lowercase;
        }
        div{
            font-size: 20px;
        }
        div.first p{
            font-size: 2em;
            text-align: center; 
            text-decoration:line-through;   
            text-transform:uppercase;
        }
    </style>       
</head>
<body>
    <h1>i am learning about font properties</h1>

    <p>i am going to change the font-family of this text</p>
    <div class="first">
        <p>this is a paragraph under parent with class</p>
        <p>this is a paragraph inside a div element</p>
    </div>
</body>
</html>

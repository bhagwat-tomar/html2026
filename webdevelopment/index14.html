<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        body {
            margin: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 100px 220px 240px;
        }

        .box {
            border: 4px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }

        .header {
            grid-column: 1 / 5;
            background-color: orange;
        }

  
        .header1 {
            grid-column: 1;
            grid-row: 2 / 4;
            background-color: pink;
        }

        .red1 {
            grid-column: 2;
            grid-row: 2;
            background-color: red;
        }

        .yellow1 {
            grid-column: 3;
            grid-row: 2;
            background-color: yellow;
        }

        .box:nth-child(5) {
            grid-column: 4;
            grid-row: 2 / 4;
            background-color: lightblue;
        }

        .green2 {
            grid-column: 2;
            grid-row: 3;
            background-color: green;
        }

        .box:nth-child(7) {
            grid-column: 3;
            grid-row: 3;
            background-color: purple;
        }

        .box:nth-child(8) {
            display: none;
        }
    </style>
</head>

<body>

    <div class="box center header">1</div>
    <div class="box center header1">2</div>
    <div class="box center red1">3</div>
    <div class="box center yellow1">4</div>
    <div class="box center">5</div>
    <div class="box center green2">6</div>
    <div class="box center">7</div>
    <div class="box center yellow1">8</div>

</body>
</html>
